name: Build APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  publish-alpha:
    runs-on: ubuntu-latest
    environment: alpha
    permissions:
      contents: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Delete alpha by GitHub CLI
        run: |
          gh release delete alpha --yes --cleanup-tag >/dev/null 2>&1 || echo "No alpha release exists."
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Rename APK to UUID
        run: |
          new_name=$(uuidgen).apk
          mv FzuHelper_7.1.8.718524.apk "$new_name"
          echo "NEW_FILENAME=$new_name" >> $GITHUB_ENV


      - name: Create GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: alpha
          name: 'Alpha'
          body: |
            1
            2
            3

            此版本为新架构测试版，请提前加入内测群 1020036141 了解详情
          prerelease: true
          files: |
            ${{ env.NEW_FILENAME }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
